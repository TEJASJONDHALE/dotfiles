# [main]
# font=JetBrains Mono Nerd Font:size=8:weight=400
# dpi-aware=yes
# lines=10
# width=50
# horizontal-pad=24
# vertical-pad=16
# inner-pad=12
# prompt-pad=8

# [colors]
# # Main background: Deep dark brown (#1a1611)
# background=1a1611dd
# # Text: Warm beige (#b8a084)
# text=b8a084ff
# # Primary accent: Warm golden amber (#d4a574)
# prompt=d4a574ff
# input=d4a574ff
# # Secondary accent: Rich bronze (#c89963)
# match=c89963ff
# # Card backgrounds: Slightly lighter brown (#211d16)
# selection=211d16ff
# # Text color for selected items
# selection-text=b8a084ff
# # Match color for selected items
# selection-match=c89963ff
# # Border color using the primary accent
# border=d4a574ff

# [border]
# radius=8
# width=2

# [dmenu]
# exit-immediately-if-empty=yes

[main]
# Matches your CSS font setting
font=JetBrains Mono Nerd Font:size=8
dpi-aware=yes

# Geometry
width=40
lines=10
horizontal-pad=15
vertical-pad=8
inner-pad=5

# "Invoke > " or just "> " matches the minimal aesthetic
prompt="> "

# Icons: Enabled to match Wofi's "allow_images=true"
icon-theme=Adwaita

[colors]
# Background: #101010 at 95% opacity (Matches your CSS rgba(16, 16, 16, 0.95))
background=101010f2

# Text: Dim Gray (Matches CSS #entry color #808080)
text=808080ff

# Input Text: White/Silver (Matches CSS #input color #e5e9f0)
input=e5e9f0ff

# Prompt: Fire Keeper Gold (Matches CSS input focus border #d4a574)
prompt=d4a574ff

# Match: Deep Amber (Matches the glow/contrast theme)
match=c89963ff

# Selection Background: Faint Gold (Matches CSS rgba(212, 165, 116, 0.1))
# This creates that subtle "lit up" row effect without being too bright
selection=d4a5741a

# Selection Text: Fire Keeper Gold (Matches CSS #entry:selected color #d4a574)
selection-text=d4a574ff

# Selection Match: Deep Amber
selection-match=c89963ff

# Border: Fire Keeper Gold (Matches CSS window border #d4a574)
border=d4a574ff

[border]
# Radius 0 to match CSS "border-radius: 0px" (Sharp corners)
radius=0
width=2

[dmenu]
exit-immediately-if-empty=yes
