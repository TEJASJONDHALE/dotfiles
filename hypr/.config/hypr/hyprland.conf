source = ~/.config/hypr/startup.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
# MONITOR CONFIG
# change monitor to high resolution, the last argument is the scale factor
# monitor=,preferred,auto,1.333
# unscale XWayland
xwayland {
  force_zero_scaling = true
}
# If you want to be more specific with your monitor:
 #monitor=DP-1,1920x1200@60.27,0x0,1

# For adaptive sync, add this:
 #monitor=,1920x1200@60.27,0x0,1,vrr,1

# For custom scale:
# monitor=,1920x1200@60.27,0x0,auto
 monitor=DP-2, 1920x1200, 0x0, 1.5
 monitor=DP-3, 1920x1200, 0x2400, 1.5
# monitor=HDMI-A-1, 1920x1200, 0x3600, 1.5
monitor=eDP-1,1920x1200@60,0x0,1.33
monitor=HDMI-A-1,1920x1200@60,1440x0,1.33
monitor=HDMI-A-1,1024x768,0x0,1,mirror,eDP-1
#monitor=HDMI-A-1,mirror,eDP-1
# toolkit-specific scale
#env = GDK_SCALE,2
#env = XCURSOR_SIZE,32
#monitor=,preferred,auto,auto 
# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area
#env = WLR_SCALE=2

# HDMI port: mirror display. To see device name, use `hyprctl monitors`
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1
#monitor=,1920x1200@60,auto,auto
#monitor=DP-3,3840x1600@60,1440x350,1
#monitor=DP-2,2560x1440@60,5280x-50,1,transform,3
#monitor = ,preferred,auto,auto
#xwayland {
# force_zero_scaling = true
#}
#monitor=DP-1,highres,auto,1.5
# Example
gesture = 3, horizontal, workspace
gesture = 3, down, close



input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0 
  touchpad {
    natural_scroll = false
  }
}

general {
  gaps_in=1
  gaps_out=5
  border_size=0
  no_border_on_floating = false
  col.active_border = rgba(d4a574ff)
    col.inactive_border = rgba(1a1611ff)
      layout = dwindle
  resize_on_border = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = true
  animate_manual_resizes = true
  animate_mouse_windowdragging = true

  enable_swallow = true
  swallow_regex = ^(foot)$
}

decoration {
  rounding = 0
  # multisample_edges = true
#  drop_shadow = 5
}

animations {
  enabled = true

  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1

  animation = windows, 1, 2, wind, slide
  animation = windowsIn, 1, 2, winIn, slide
  animation = windowsOut, 1, 2, winOut, slide
  animation = windowsMove, 1, 2, wind, slide
  animation = fade, 1, 2, default
  animation = workspaces, 1, 2, wind
}

dwindle {
 # no_gaps_when_only = false
  pseudotile = true 
  preserve_split = true 
}


exec-once = nm-applet
exec-once = volumeicon
exec-once = blueman-applet


#env = QT_QPA_PLATFORM,wayland
#env = QT_QPA_PLATFORMTHEME,qt5ct
#env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
#env = QT_AUTO_SCREEN_SCALE_FACTOR,1
#env = WLR_NO_HARDWARE_CURSORS,1
#env = GDK_SCALE,1.5
#env = XCURSOR_SIZE,24
#env = QT_SCALE_FACTOR,1.5

#monitor=HDMI-A-1,1024x768,1440x0,1.0
#workspace=5,monitor:HDMI-A-1
#bind=,switchmonitor,workspace
#bind=SUPER,Tab,focusmonitor,eDP-1
#bind=SUPER,Shift+Tab,focusmonitor,HDMI-A-1
env = WLR_DRM_DEVICES,/dev/dri/card1

# Start cliphist in the background (persistent clipboard)
exec-once = wl-paste --watch cliphist store
